<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=375, initial-scale=1" />
    <title>Explore — mid-swipe right</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        font-size: var(--text-md);
        line-height: var(--leading-normal);
        width: 375px;
        min-height: 100vh;
      }
      .screen {
        display: flex;
        flex-direction: column;
        width: 375px;
        height: 667px;
      }

      /* Topbar */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 48px;
        padding: 0 var(--spacing-4);
        flex-shrink: 0;
      }
      .topbar h1 {
        margin: 0;
        font-size: var(--text-lg);
        font-weight: var(--font-weight-semibold);
      }
      .phase-pill {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-2);
        padding: var(--spacing-1) var(--spacing-3);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        font-size: var(--text-xs);
        color: var(--color-text-muted);
      }
      .phase-pill .dot {
        width: 6px;
        height: 6px;
        background: var(--color-accent);
        border-radius: var(--radius-full);
      }

      /* Card stack */
      .stack-area {
        flex: 1;
        position: relative;
        padding: var(--spacing-4);
      }
      .card {
        position: absolute;
        left: var(--spacing-4);
        right: var(--spacing-4);
        top: 0;
        bottom: 0;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        padding: var(--spacing-4);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-3);
      }
      /* The "next" card — now fully visible since the top is leaving */
      .card.behind {
        transform: scale(0.97) translateY(4px);
        opacity: 0.9;
        z-index: 1;
      }
      /* The "top" card — being swiped right */
      .card.swiping-right {
        transform: translate(80px, -8px) rotate(8deg);
        opacity: 0.92;
        z-index: 2;
      }

      .artwork {
        width: 100%;
        flex: 1;
        min-height: 0;
        border-radius: var(--radius-md);
        background:
          radial-gradient(
            120% 100% at 30% 20%,
            oklch(0.45 0.18 320) 0%,
            oklch(0.32 0.12 280) 60%,
            oklch(0.22 0.05 260) 100%
          );
        position: relative;
        overflow: hidden;
      }
      .artwork::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            80% 60% at 70% 80%,
            oklch(0.7 0.2 30 / 0.35) 0%,
            transparent 70%
          );
      }

      /* LIKE stamp on top of card during right swipe */
      .like-stamp {
        position: absolute;
        top: 24px;
        left: 24px;
        padding: var(--spacing-2) var(--spacing-4);
        border: 3px solid var(--color-success);
        border-radius: var(--radius-md);
        color: var(--color-success);
        font-size: var(--text-2xl);
        font-weight: var(--font-weight-bold);
        letter-spacing: 0.1em;
        transform: rotate(-12deg);
        background: oklch(0.18 0.01 270 / 0.4);
      }

      .scrubber {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        font-size: var(--text-xs);
        color: var(--color-text-muted);
      }
      .play-icon {
        width: 14px;
        height: 14px;
        color: var(--color-text);
      }
      .track-progress {
        flex: 1;
        height: 3px;
        background: var(--color-border);
        border-radius: var(--radius-full);
        position: relative;
      }
      .track-progress::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 28%;
        background: var(--color-primary);
        border-radius: var(--radius-full);
      }
      .track-progress::after {
        content: "";
        position: absolute;
        left: 28%;
        top: 50%;
        width: 10px;
        height: 10px;
        background: var(--color-text);
        border-radius: var(--radius-full);
        transform: translate(-50%, -50%);
      }

      .title {
        margin: 0;
        font-size: var(--text-xl);
        font-weight: var(--font-weight-semibold);
        line-height: var(--leading-tight);
      }
      .artist-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--spacing-2);
      }
      .artist {
        font-size: var(--text-sm);
        color: var(--color-text-muted);
      }
      .source-badge {
        font-size: var(--text-xs);
        color: var(--color-text-muted);
        padding: var(--spacing-1) var(--spacing-2);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
      }
      .chips {
        display: flex;
        gap: var(--spacing-2);
        flex-wrap: wrap;
      }
      .chip {
        font-size: var(--text-xs);
        color: var(--color-text-muted);
        padding: var(--spacing-1) var(--spacing-2);
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
      }

      /* Actions — like button highlighted (mirroring the swipe) */
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-around;
        height: 80px;
        padding: 0 var(--spacing-6);
        flex-shrink: 0;
      }
      .action-btn {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-full);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-xl);
      }
      .action-btn.pass {
        color: var(--color-danger);
      }
      .action-btn.play {
        color: var(--color-text);
      }
      .action-btn.like {
        color: var(--color-bg);
        background: var(--color-success);
        border-color: var(--color-success);
      }

      .bottom-nav {
        display: flex;
        height: 56px;
        background: var(--color-surface);
        border-top: 1px solid var(--color-border);
        flex-shrink: 0;
      }
      .nav-tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-1);
        font-size: var(--text-xs);
        color: var(--color-text-muted);
      }
      .nav-tab.active {
        color: var(--color-primary);
      }
      .nav-icon {
        font-size: var(--text-lg);
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <header class="topbar">
        <h1>Explore</h1>
        <span class="phase-pill"><span class="dot"></span>Discovering taste</span>
      </header>

      <main class="stack-area">
        <!-- Next card behind, scaled up since top is leaving -->
        <article class="card behind" aria-hidden="true">
          <div class="artwork" style="background: radial-gradient(120% 100% at 30% 20%, oklch(0.5 0.16 25) 0%, oklch(0.32 0.1 15) 60%, oklch(0.2 0.04 260) 100%);"></div>
          <h2 class="title">Levitating</h2>
          <div class="artist-row">
            <span class="artist">Dua Lipa</span>
            <span class="source-badge">SoundCloud</span>
          </div>
        </article>
        <!-- Top card mid-swipe-right -->
        <article class="card swiping-right">
          <div class="artwork">
            <span class="like-stamp">LIKE</span>
          </div>
          <div class="scrubber">
            <span class="play-icon" aria-hidden="true">▶</span>
            <div class="track-progress"></div>
            <span>0:08 / 0:30</span>
          </div>
          <h2 class="title">Bohemian Rhapsody</h2>
          <div class="artist-row">
            <span class="artist">Queen</span>
            <span class="source-badge">Audius</span>
          </div>
          <div class="chips">
            <span class="chip">rock</span>
            <span class="chip">classic-rock</span>
          </div>
        </article>
      </main>

      <div class="actions">
        <button class="action-btn pass" aria-label="Pass">✕</button>
        <button class="action-btn play" aria-label="Pause">⏸</button>
        <button class="action-btn like" aria-label="Like">♥</button>
      </div>

      <nav class="bottom-nav">
        <div class="nav-tab active">
          <span class="nav-icon">⊙</span>
          <span>Explore</span>
        </div>
        <div class="nav-tab">
          <span class="nav-icon">♡</span>
          <span>Taste</span>
        </div>
        <div class="nav-tab">
          <span class="nav-icon">⌕</span>
          <span>Search</span>
        </div>
      </nav>
    </div>
  </body>
</html>
