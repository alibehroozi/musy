# Claude PR responder
#
# Triggers when the repo OWNER (you) writes `@claude ...` in:
#   - a PR / issue conversation comment
#   - an inline code review comment ("Files changed" tab → comment on a line)
#   - a PR review submission body
#
# `author_association == 'OWNER'` is the gate: only your comments fire the
# workflow. Comments from other contributors / bots / drive-by mentions
# are ignored. Add 'COLLABORATOR' or 'MEMBER' to the list later if you
# want to share the trigger.
#
# The action automatically:
#   - checks out the PR's branch (not main)
#   - reads the comment body as the prompt
#   - has tool access to read the PR diff and reply in-thread
#   - pushes follow-up commits to the same branch

name: Claude PR responder

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Suppress npm interactive prompts
        run: |
          npm config set fund false
          npm config set audit false

      - run: npm ci

      - name: Install Playwright browsers
        # For Layer 2 visual regression — same as auto-feature.
        run: npx playwright install chromium --with-deps

      - name: Bring up MongoDB
        run: docker compose up -d mongo

      - name: Wait for Mongo healthy
        run: |
          until docker compose ps --format "{{.Name}} {{.Status}}" | grep -q "musy-mongo .*healthy"; do
            sleep 2
          done

      - name: Seed CI .env.local files
        # Same shape as auto-feature.yml. SESSION_SECRET regenerated per run
        # (no continuity needed). GOOGLE_* are dummies — tests mock OAuth.
        run: |
          SESSION_SECRET="$(openssl rand -hex 48)"
          cat > apps/api/.env.local <<EOF
          NODE_ENV=development
          API_PORT=3001
          WEB_ORIGIN=http://localhost:5173
          MONGO_URI=mongodb://localhost:27117/musy
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=
          GOOGLE_CLIENT_ID=ci-dummy
          GOOGLE_CLIENT_SECRET=ci-dummy
          GOOGLE_REDIRECT_URI=http://localhost:5173/api/auth/google/callback
          SESSION_SECRET=${SESSION_SECRET}
          EOF
          cat > apps/web/.env.local <<EOF
          VITE_API_URL=/api
          VITE_API_TARGET=http://localhost:3001
          VITE_WEB_PORT=5173
          EOF

      - name: Configure git author for autonomous commits
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code-bot@users.noreply.github.com"

      - name: Run Claude Code
        # Same auth as auto-feature: Pro OAuth token + the Claude Code
        # GitHub App. The action auto-detects the trigger event and reads
        # the comment / review body as the user task; the `prompt:` below
        # gets *prepended* to that, giving the agent project context
        # before it acts on the comment.
        #
        # Without this prompt, the agent treats short comments literally
        # ("@claude make it blue" → hard-codes a color) and skips the
        # design-system / layering / micro-commit rules.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: "claude-sonnet-4-6"
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          claude_args: --dangerously-skip-permissions
          show_full_output: true
          prompt: |
            You're responding to an @claude mention on a PR. Your task is
            the body of that comment / review. Before acting on it,
            ground yourself in the project spec.

            ## CI override on slash-command pauses (read first)
            Every "wait for sign-off" / "stop and wait" / "stop and ask" /
            "get user approval" / "loop until approved" instruction inside
            any `.claude/commands/*.md` is **auto-approved** here. The
            user's comment is the recorded approval. Proceed without
            pausing — there's no human to answer.

            ## Read the project spec first
            Before any change, read:
              - `AGENTS.md` — hard rules (commit discipline, layering,
                privacy, design-system conformance, etc.)
              - `ARCHITECTURE.md` — per-package layout, when-to-use-what
              - `DESIGN.md` — design system token reference + component
                catalog
              - The PR diff and any earlier @claude responses in the
                thread (so you build on prior work, not duplicate it)

            ## Hard rules that apply to every comment-driven change
            - **#8 Conform to `ARCHITECTURE.md`.** Layering, file roles,
              when-to-use-what. Don't reach across layers.
            - **#10 Micro-commits.** spec → tests → code by layer. Each
              commit conventional: `feat(<scope>):`, `fix(<scope>):`,
              `change(<scope>):`, `refactor(<scope>):`, `test(<scope>):`,
              `spec:`, `docs(<scope>):`.
            - **Design system gate.** For any UI change: use components
              from `@moc/design-system`. **Never** hard-code colors,
              spacing, radii, or font sizes — use Tailwind utilities that
              resolve to tokens (`bg-primary`, `p-4`, `rounded-md`,
              `text-md`). If the change needs a component the catalog
              doesn't have, run `/design-system` to add it FIRST in
              separate commits, then apply it. "I'll just inline this
              one button" is the warning sign — stop and add to the DS.
            - **#12 Visual baselines are sacred until proven intentional.**
              When `npm run verify:visual` fails (Lost Pixel for Ladle
              stories, Playwright for app pages), default conclusion is
              code is wrong. Regenerate ONLY when the diff matches the UI
              change the user's comment explicitly asked for, and ONLY
              for the specific spec/story affected — **never** the
              workspace-wide `:update` scripts (they overwrite every
              drifted baseline at once, silently making any unrelated
              regression the new "correct"). Targeted recipes:
                - **Playwright:** `npm --workspace apps/web run
                  test:visual:update -- tests/e2e/<spec>.spec.ts`
                  (append `-g "<title>"` for finer scope).
                - **Lost Pixel:** run a compare first
                  (`npm run test:visual:ds || true`), inspect
                  `libs/web/design-system/.lostpixel/difference/`,
                  classify each entry as new / intended / unrelated, and
                  `cp` only the specific
                  `current/<story>--<variant>__*.png` files into
                  `baseline/`. Unrelated drift = STOP, fix code.
              If unsure, fix the code, not the baseline.
            - **TDD.** Test before source when behavior changes. Fix
              source, never weaken tests.

            ## What you do, what you don't
            - You push follow-up commits to the **PR's branch** (already
              checked out by the action).
            - You **reply in the comment thread** when done: what you
              changed, the commit hashes, `npm run verify` result.
            - **Don't open new PRs.** This is a follow-up on an existing
              one.
            - **Don't merge the PR.** That's the human gate.

            ## Process
            1. Read the comment to understand what's being asked.
            2. Read `AGENTS.md`, `ARCHITECTURE.md`, `DESIGN.md`, and the
               PR diff (`gh pr diff`).
            3. Plan the change against the rules above. If a UI piece
               needs a missing DS component, surface that before coding
               and run `/design-system` first.
            4. Make the changes, committing per the discipline.
            5. Run `npm run verify` once at the branch HEAD. Then run
               `npm run verify:visual` (Layers 1+2). On a visual
               failure, apply the regenerate-vs-fix decision tree from
               hard rule #12: regenerate ONLY if the user's comment
               asked for that exact UI change; otherwise fix code.
               When you regenerate baselines, commit them as
               `feat(visual): regenerate baselines for <change>`.
            6. `git push`. Reply in the comment thread summarizing what
               you changed, the commit hashes, and verify + visual
               results.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
