<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=375, initial-scale=1" />
    <title>Search with mini-player</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        font-size: var(--text-md);
        line-height: var(--leading-normal);
        width: 375px;
        min-height: 100vh;
      }

      .shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 375px;
        overflow: hidden;
      }

      .scroll {
        flex: 1 1 auto;
        overflow-y: auto;
        padding-bottom: var(--spacing-2);
      }

      .h1 {
        font-size: var(--text-2xl);
        font-weight: var(--font-weight-bold);
        line-height: var(--leading-tight);
        padding: var(--spacing-4) var(--spacing-4) var(--spacing-2);
      }

      /* ── Search input ── */
      .search-wrap {
        padding: 0 var(--spacing-4) var(--spacing-3);
      }
      .search {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--spacing-3) var(--spacing-3);
      }
      .search input {
        flex: 1;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--color-text);
        font-size: var(--text-md);
        font-family: inherit;
      }
      .search .clear {
        color: var(--color-text-muted);
      }

      /* ── Result rows ── */
      .row {
        display: flex;
        align-items: center;
        gap: var(--spacing-3);
        padding: var(--spacing-3) var(--spacing-4);
      }
      .row + .row {
        border-top: 1px solid var(--color-border);
      }
      .artwork {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-md);
        background: var(--color-surface);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-xl);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-muted);
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }
      .artwork.gradient {
        background: linear-gradient(
          135deg,
          oklch(0.5 0.15 320),
          oklch(0.4 0.12 280)
        );
        color: var(--color-text);
      }
      .artwork.gradient-2 {
        background: linear-gradient(
          135deg,
          oklch(0.55 0.13 200),
          oklch(0.4 0.1 240)
        );
        color: var(--color-text);
      }
      .artwork.gradient-3 {
        background: linear-gradient(
          135deg,
          oklch(0.6 0.16 30),
          oklch(0.45 0.14 350)
        );
        color: var(--color-text);
      }
      .artwork .play-overlay {
        position: absolute;
        inset: 0;
        background: rgb(0 0 0 / 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text);
      }
      .row-meta {
        flex: 1;
        min-width: 0;
      }
      .row-title {
        font-size: var(--text-md);
        font-weight: var(--font-weight-medium);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-sub {
        font-size: var(--text-sm);
        color: var(--color-text-muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-trailing {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        flex-shrink: 0;
      }
      .badge {
        display: inline-block;
        padding: var(--spacing-1) var(--spacing-2);
        border-radius: var(--radius-full);
        background: var(--color-border);
        color: var(--color-text-muted);
        font-size: var(--text-xs);
        text-transform: capitalize;
        white-space: nowrap;
      }
      .icon-btn {
        background: transparent;
        border: 0;
        color: var(--color-text-muted);
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        cursor: pointer;
      }

      /* ── Mini-player ── */
      .mini {
        display: grid;
        grid-template-columns: 40px 1fr auto auto;
        align-items: center;
        gap: var(--spacing-3);
        padding: var(--spacing-3) var(--spacing-3);
        background: var(--color-surface);
        border-top: 1px solid var(--color-border);
        position: relative;
      }
      .mini .progress {
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        background: var(--color-primary);
        width: 38%;
      }
      .mini .progress-track {
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        background: var(--color-border);
        width: 100%;
      }
      .mini-art {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-sm);
        background: linear-gradient(
          135deg,
          oklch(0.5 0.15 320),
          oklch(0.4 0.12 280)
        );
        flex-shrink: 0;
      }
      .mini-meta {
        min-width: 0;
      }
      .mini-title {
        font-size: var(--text-sm);
        font-weight: var(--font-weight-medium);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini-sub {
        font-size: var(--text-xs);
        color: var(--color-text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini-btn {
        background: transparent;
        border: 0;
        color: var(--color-text);
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
      }
      .mini-btn.expand {
        color: var(--color-text-muted);
      }

      /* ── Bottom nav ── */
      .bottom-nav {
        display: flex;
        background: var(--color-surface);
        border-top: 1px solid var(--color-border);
        height: 64px;
        flex-shrink: 0;
      }
      .nav-tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-1);
        color: var(--color-text-muted);
        font-size: var(--text-xs);
        background: transparent;
        border: 0;
      }
      .nav-tab.active {
        color: var(--color-text);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="scroll">
        <div class="h1">Search</div>
        <div class="search-wrap">
          <div class="search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-text-muted)" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <input value="daft punk" />
            <span class="clear">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
            </span>
          </div>
        </div>

        <!-- Result rows -->
        <div class="row">
          <div class="artwork gradient">
            G
            <div class="play-overlay">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
            </div>
          </div>
          <div class="row-meta">
            <div class="row-title">Get Lucky</div>
            <div class="row-sub">Daft Punk · 2013 · 4:09</div>
          </div>
          <div class="row-trailing">
            <span class="badge">Audius</span>
            <button class="icon-btn" aria-label="Save">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <div class="artwork gradient-2">A</div>
          <div class="row-meta">
            <div class="row-title">Around the World</div>
            <div class="row-sub">Daft Punk · 1997 · 7:11</div>
          </div>
          <div class="row-trailing">
            <span class="badge">SoundCloud</span>
            <button class="icon-btn" aria-label="Save">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <div class="artwork gradient-3">H</div>
          <div class="row-meta">
            <div class="row-title">Harder, Better, Faster, Stronger</div>
            <div class="row-sub">Daft Punk · 2001 · 3:45</div>
          </div>
          <div class="row-trailing">
            <span class="badge">Audius</span>
            <button class="icon-btn" aria-label="Save">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <div class="artwork gradient-2">O</div>
          <div class="row-meta">
            <div class="row-title">One More Time</div>
            <div class="row-sub">Daft Punk · 2000 · 5:20</div>
          </div>
          <div class="row-trailing">
            <span class="badge">SoundCloud</span>
            <button class="icon-btn" aria-label="Save">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Mini player -->
      <div class="mini" role="region" aria-label="Now playing">
        <div class="progress-track"></div>
        <div class="progress"></div>
        <div class="mini-art" aria-hidden="true"></div>
        <div class="mini-meta">
          <div class="mini-title">Get Lucky</div>
          <div class="mini-sub">Daft Punk</div>
        </div>
        <button class="mini-btn" aria-label="Pause">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
        <button class="mini-btn expand" aria-label="Expand player">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
        </button>
      </div>

      <!-- Bottom nav -->
      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-tab" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
          Explore
        </button>
        <button class="nav-tab" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
          Taste
        </button>
        <button class="nav-tab active" type="button" aria-current="page">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          Search
        </button>
      </nav>
    </div>
  </body>
</html>
