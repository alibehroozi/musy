# Verification Pipeline
#
# Layer 1: Lint + Types + Build         (seconds)
# Layer 2: Invariant tests + units      (seconds)
# Layer 3: Playwright E2E               (runs in a separate workflow once added)
#
# Plus: gitleaks. No secrets ever land in the repo. Hard rule, enforced.

name: Verification Pipeline

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────
  # Hard rule: no secrets committed
  # ──────────────────────────────────────────────
  gitleaks:
    name: "gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Layer 1: Lint + Types + Build
  # ──────────────────────────────────────────────
  layer-1-build:
    name: "Layer 1: Lint + Types + Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # ──────────────────────────────────────────────
  # Layer 2: Invariant + unit tests
  # ──────────────────────────────────────────────
  layer-2-invariants:
    name: "Layer 2: Invariants + units"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:invariants
      - run: npm run test
