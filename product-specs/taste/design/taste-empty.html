<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1" />
  <title>Taste — empty</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    .app { display: flex; flex-direction: column; height: 667px; }

    .header {
      flex: 0 0 auto;
      padding: var(--spacing-4) var(--spacing-4) var(--spacing-2);
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 {
      font-size: var(--text-2xl);
      font-weight: var(--font-weight-bold);
      line-height: var(--leading-tight);
    }

    .content {
      flex: 1 1 auto;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: var(--spacing-6) var(--spacing-6);
      text-align: center;
    }

    .icon-circle {
      width: 88px; height: 88px;
      border-radius: var(--radius-full);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
      margin-bottom: var(--spacing-6);
    }

    .empty-title {
      font-size: var(--text-xl);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--spacing-2);
    }
    .empty-desc {
      font-size: var(--text-md);
      color: var(--color-text-muted);
      margin-bottom: var(--spacing-8);
      max-width: 260px;
    }

    .btn {
      width: 100%;
      padding: var(--spacing-3) var(--spacing-4);
      border-radius: var(--radius-md);
      font-size: var(--text-md);
      font-weight: var(--font-weight-medium);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: var(--spacing-2);
      min-height: 44px;
    }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-text);
    }
    .btn-ghost {
      background: transparent;
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }
    .btn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .cta-stack { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: var(--spacing-3); }
    .coming-soon { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: -4px; }

    /* Bottom nav */
    .bottom-nav {
      flex: 0 0 auto;
      height: 64px;
      border-top: 1px solid var(--color-border);
      background: var(--color-bg);
      display: flex; align-items: center; justify-content: space-around;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px;
      color: var(--color-text-muted);
      font-size: var(--text-xs);
      padding: var(--spacing-2);
    }
    .nav-item.active { color: var(--color-text); }
    .nav-item .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header"><h1>Taste</h1></header>

    <main class="content">
      <div class="icon-circle">🎵</div>
      <div class="empty-title">Build your Taste</div>
      <div class="empty-desc">Swipe in Explore to create your buckets — they'll appear here once we have enough signal.</div>

      <div class="cta-stack">
        <button class="btn btn-primary">Go to Explore  →</button>
        <button class="btn btn-ghost" disabled>Import from Spotify</button>
        <div class="coming-soon">Coming soon</div>
      </div>
    </main>

    <nav class="bottom-nav">
      <div class="nav-item"><span class="nav-icon">🔥</span>Explore</div>
      <div class="nav-item"><span class="nav-icon">🔍</span>Search</div>
      <div class="nav-item active"><span class="nav-icon">✨</span>Taste</div>
    </nav>
  </div>
</body>
</html>
