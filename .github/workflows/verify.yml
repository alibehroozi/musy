# Verification Pipeline
#
# Layer 1: Lint + Types + Build         (seconds)
# Layer 2: Invariant tests + units      (seconds)
# Layer 3: Playwright E2E               (runs in a separate workflow once added)
#
# Plus: gitleaks. No secrets ever land in the repo. Hard rule, enforced.

name: Verification Pipeline

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────
  # Hard rule: no secrets committed
  # ──────────────────────────────────────────────
  gitleaks:
    name: "gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Layer 1: Lint + Types + Build
  # ──────────────────────────────────────────────
  layer-1-build:
    name: "Layer 1: Lint + Types + Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # ──────────────────────────────────────────────
  # Layer 2: Invariant + unit tests
  # ──────────────────────────────────────────────
  layer-2-invariants:
    name: "Layer 2: Invariants + units"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:invariants
      - run: npm run test

  # ──────────────────────────────────────────────
  # Deploy: only on push to main, only after verify passes.
  # See ARCHITECTURE.md § Deployment and DEPLOY.md.
  # ──────────────────────────────────────────────
  deploy-api:
    name: "Deploy API → Cloud Run"
    needs: [gitleaks, layer-1-build, layer-2-invariants]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push container
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/musy/api
        run: |
          docker build -f apps/api/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: musy-api
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/musy/api:${{ github.sha }}
          region: ${{ secrets.GCP_REGION }}
          flags: --allow-unauthenticated --port=8080

  deploy-web:
    name: "Deploy Web → Cloudflare Pages"
    needs: [gitleaks, layer-1-build, layer-2-invariants]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Build web bundle
        env:
          # VITE_API_URL is inlined into the bundle at build time. Set this
          # GitHub secret to the Cloud Run service URL after the first
          # deploy-api succeeds (see DEPLOY.md step 8).
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build --workspace apps/web

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=musy --branch=main
