# Auto-implement next pending feature
#
# Triggers:
#   - workflow_dispatch — manual run from Actions tab or `gh workflow run`.
#     Inputs let you target a specific feature path and pick a model.
#   - schedule — every 5 hours (matches Claude Pro's rolling session
#     window so each run starts with a fresh quota).
#
# Concurrency is single-track: one auto-feature run at a time so two
# agents don't race on the same pending-epic file. If a scheduled run
# fires while a manual one is still going, the scheduled run queues.
#
# Output: a draft PR opened immediately and grown commit-by-commit,
# then flipped to ready-for-review when `npm run verify` is green at
# branch HEAD. The PR is the unit of work, not the run — see "Resume
# semantics" below. The human gate is PR review.
#
# Resume semantics: if a run dies (timeout, runner kill, transient
# error) with its draft PR still open, the next scheduled run picks
# up where it left off — checks out the branch, inspects commit
# prefixes to figure out which micro-commit stages already landed,
# and continues from the first missing stage. Closing the PR (without
# merging) is the lever to drop a feature from the queue: the next
# run sees the closed PR for that feature's `task-<slug>` branch and
# skips to the next pending one. No need to edit `status:` frontmatter.

name: Auto-implement next pending feature

on:
  workflow_dispatch:
    inputs:
      feature_path:
        description: "Optional: explicit product-specs/.../NN-<slug>.md path. Leave blank to auto-pick the lowest-numbered pending feature."
        required: false
        type: string
      model:
        description: "Model family. 'sonnet' is the default — cheap on Pro quota, fast enough for most features. 'opus' is the heavyweight; pick it for tricky / large features. Aliases auto-track the latest version in each family."
        required: false
        default: "sonnet"
        type: choice
        options:
          - "sonnet"
          - "opus"
      debug:
        description: "Verbose mode: stream Claude's tool I/O, model thinking, and per-step diagnostics. Off for cron runs."
        required: false
        default: false
        type: boolean
  schedule:
    # Every 5 hours, on the hour: 00:00, 05:00, 10:00, 15:00, 20:00 UTC.
    # Matches Claude Pro's session window so each run starts fresh.
    - cron: "0 */2 * * *"

concurrency:
  group: auto-feature
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Suppress npm interactive prompts
        # Some npm prompts (audit summary, funding banner) ignore CI=true
        # and slow / hang the install. Disable explicitly.
        run: |
          npm config set fund false
          npm config set audit false

      - run: npm ci

      - name: Install Playwright browsers
        # Layer 2 visual regression needs Chromium. --with-deps installs
        # the OS-level libs Playwright needs on the runner. Cached across
        # runs by setup-node's npm cache plus Playwright's own cache dir
        # is short-lived; this step takes ~30s on a cold cache, ~5s warm.
        # Run via the apps/web workspace because @playwright/test is pinned
        # to 1.47.x there (matches lost-pixel's playwright-core@1.47.2). With
        # that pin, npm doesn't hoist `playwright` to the root .bin dir, so
        # `npx playwright` from the repo root fails with `playwright: not
        # found`. `npm exec --workspace apps/web` resolves it correctly.
        run: npm exec --workspace apps/web -- playwright install chromium --with-deps

      - name: Bring up MongoDB (matches /prepare-local step 4)
        run: docker compose up -d mongo

      - name: Wait for Mongo healthy
        run: |
          until docker compose ps --format "{{.Name}} {{.Status}}" | grep -q "musy-mongo .*healthy"; do
            sleep 2
          done

      - name: Seed CI .env.local files
        # CI has no user-set values; write the same shape /prepare-local does.
        # SESSION_SECRET is generated per run because:
        #   - apps/api boots via getOrThrow("SESSION_SECRET") (auth module
        #     init), so leaving it blank crashes any test that boots the API.
        #   - sessions don't need to survive across CI runs, so a fresh
        #     value each run is fine and avoids needing a GitHub secret.
        # GOOGLE_* are dummies — auth.service.ts looks them up lazily,
        # so dummies satisfy boot. CI tests mock the OAuth flow; if any
        # test ever hits real Google with these dummies, it'll fail loudly
        # with an HTTP error from Google rather than a missing-env crash.
        run: |
          SESSION_SECRET="$(openssl rand -hex 48)"
          cat > apps/api/.env.local <<EOF
          NODE_ENV=development
          API_PORT=3001
          WEB_ORIGIN=http://localhost:5173
          MONGO_URI=mongodb://localhost:27117/musy
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=
          GOOGLE_CLIENT_ID=ci-dummy
          GOOGLE_CLIENT_SECRET=ci-dummy
          GOOGLE_REDIRECT_URI=http://localhost:5173/api/auth/google/callback
          SESSION_SECRET=${SESSION_SECRET}
          EOF
          cat > apps/web/.env.local <<EOF
          VITE_API_URL=/api
          VITE_API_TARGET=http://localhost:3001
          VITE_WEB_PORT=5173
          EOF

      - name: Configure git author for autonomous commits
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code-bot@users.noreply.github.com"

      - name: Run Claude Code
        # OAuth token (Pro / Max subscription billing) instead of an API key.
        # Generate locally with `claude setup-token`, store as the
        # `CLAUDE_CODE_OAUTH_TOKEN` repository secret.
        # claude_args breakdown:
        #
        #   --model <family>  (sonnet | opus)
        #     Per claude-code-action docs, model selection is passed
        #     through claude_args as `--model <value>`, not the
        #     top-level `model:` input (the action stopped honoring
        #     that — silent fall-through to default). Aliases
        #     `sonnet` / `opus` resolve to the latest in family per
        #     the user's subscription, which is what we want — pinned
        #     dated IDs go stale and need manual bumps.
        #
        #     Picks the workflow_dispatch input when set, else
        #     'sonnet' (also the value cron runs see, since
        #     workflow_dispatch inputs are empty under schedule
        #     triggers).
        #
        #   --dangerously-skip-permissions  (always, CI only)
        #     The project's .claude/settings.json has narrow Bash patterns
        #     tuned for interactive use (e.g. `Bash(npm install)` matches
        #     the bare command but not `npm install --workspace apps/web
        #     react-router-dom`). In CI there's no human to approve the
        #     prompt, so anything outside the exact-match allowlist hangs
        #     forever or aborts. This flag tells Claude Code to skip
        #     permission gating entirely. Safe in CI because:
        #       - the runner is ephemeral
        #       - GITHUB_TOKEN scopes are constrained by the workflow's
        #         `permissions:` block above
        #       - the PR review is the human gate on actual changes
        #     Never set this for local / interactive runs.
        #
        #   --verbose  (when debug is on)
        #     Full tool I/O + model reasoning instead of just the
        #     high-level summary.
        #
        # Companion knobs:
        #   show_full_output: true → un-hides the action's SDK-wrapped
        #     output (it's hidden by default for "security" — that's why
        #     `Running Claude Code via SDK (full output hidden for
        #     security)` shows up in non-debug runs)
        #   ANTHROPIC_LOG=debug (env block below) → SDK logs raw HTTP
        #
        # For full Actions runner debug (every step's command + env
        # expansion), also set repo-level variable ACTIONS_STEP_DEBUG=true
        # under Settings → Secrets and variables → Actions → Variables.
        # One-time, applies to every workflow on the repo.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          claude_args: --model ${{ github.event.inputs.model || 'sonnet' }} --dangerously-skip-permissions ${{ github.event.inputs.debug == 'true' && '--verbose' || '' }}
          show_full_output: ${{ github.event.inputs.debug == 'true' }}
          prompt: |
            You're running in CI under GitHub Actions. No human is at the
            other end during this run — the PR review is the human gate.

            ## CI override on slash-command pauses (read first, applies to everything below)
            Every "wait for sign-off", "stop and wait", "stop and ask",
            "get user approval", "loop until approved", or similar pause
            instruction inside any `.claude/commands/*.md` is **auto-
            approved** when running under this workflow. The pending-epic
            feature file is the user's pre-recorded answer to those
            questions: scope, tooling, design-system check, invariants,
            acceptance criteria. Proceed without pausing. If you find
            yourself about to wait for input, stop and proceed instead.

            ## Your job
            Implement one pending feature from `product-specs/`, **driving
            a draft PR that grows commit-by-commit** so a human (or the
            next run, if this one dies) can see exactly where you are.

            ## Algorithm

            ### Step 1 — pick the feature

            If the input `${{ github.event.inputs.feature_path }}` is
            non-empty, that's the feature file. Use it directly and skip
            ahead to Step 2.

            Otherwise, walk `product-specs/*/features/NN-*.md` and
            partition the epics that contain at least one
            `status: pending` feature into two tiers based on each
            epic's existing progress:

              - **Tier 1 — in-progress epics.** The epic's `features/`
                folder contains at least one file whose frontmatter
                has `status: done`. Work-in-flight finishes before
                new work starts: shipping epic-by-epic keeps the
                product coherent and avoids ten half-built epics
                sitting in `main` at once.
              - **Tier 2 — fresh epics.** No feature in the epic is
                yet `status: done`.

            Within each tier, sort epics alphabetically by directory
            name. Within each epic, sort its `status: pending`
            features by numeric prefix ascending. Walk Tier 1 first,
            then Tier 2. The first candidate that survives the
            closed-PR filter below is the feature for this run.

            **Closed-PR filter** (applied to each candidate in walk
            order): derive the slash-command's recommended branch
            name (e.g. `task-<slug>`) and check:

                gh pr list --head <branch> --state closed --json number,state --limit 1

            If a closed/merged PR exists for that branch, **skip this
            feature** — closing a PR without merging is the user's
            signal to drop it from the queue — and move to the next
            candidate (still respecting tier order: exhaust the
            remaining Tier 1 candidates before falling into Tier 2).

            If nothing qualifies in either tier, print a one-line
            summary and exit cleanly without committing.

            ### Step 2 — branch on PR + branch state

            With feature file picked and `<branch>` derived:

              a. **Open PR exists** (`gh pr list --head <branch>
                 --state open --json number,url` returns a row) →
                 **resume mode**. Run:

                     git fetch origin <branch>
                     git checkout <branch>
                     git reset --hard origin/<branch>

                 Then inspect

                     git log --reverse origin/main..HEAD --pretty=format:%s

                 and identify which micro-commit stages already landed
                 by their conventional prefixes (`spec:`,
                 `test(invariants):`, `feat(contracts):`,
                 `feat(api-core):`, `feat(api):`, `feat(web-core):`,
                 `feat(web):`, `test(visual, web):`, plus any
                 `feat(visual):` / `chore(visual):` baselines and the
                 final docs feature-marking commit). Continue from
                 the first missing stage; **never redo a stage already
                 on the branch**. If `feat(web):` landed but
                 `test(visual, web):` did not, the feature is
                 incomplete — Step 4a applies and that's the next
                 stage to author. Record the existing PR number —
                 that's where you push and comment.

              b. **No open PR but the branch exists on origin** —
                 orphan from a prior run that never opened the PR.
                 Fetch + checkout it as in (a), then open a draft PR
                 for it yourself per Step 3, then proceed as resume.

              c. **Neither branch nor open PR** → **fresh start**.
                 Create the branch off `main`, do the spec commit
                 (per /new-feature step 1 — `INVARIANTS.md` update;
                 if the feature genuinely has no spec changes, an
                 empty `chore(<scope>): bootstrap <slug>` commit
                 instead so the PR has something to point at), push,
                 and open the draft PR per Step 3.

            Never force-push. Resume mode appends; it never rewrites
            history.

            ### Step 3 — open the draft PR (fresh-start case)

            Run `gh pr create --draft --title "task: <slug>" --body
            "<body>"`. **Always pass `--title` and `--body` non-
            interactively** — never let the command open an editor
            (it'll hang in CI).

            Body template:

            ```markdown
            ## Source
            `<feature file path>`

            ## Progress
            - [x] spec — INVARIANTS update
            - [ ] test(invariants) — stub red
            - [ ] feat(contracts) — Zod schemas
            - [ ] feat(api-core) — pure logic
            - [ ] feat(api) — Nest module
            - [ ] feat(web-core) — fetcher
            - [ ] feat(web) — UI
            - [ ] test(visual, web) — Playwright e2e spec covering every User-behavior scenario (drop only for purely backend-only features)
            - [ ] verify green at HEAD
            - [ ] visual baselines green
            - [ ] feature marked done

            ## Commits
            - <first-commit-subject>
            ```

            Drop checklist lines for layers this feature genuinely
            doesn't touch. Tick the spec line if you just made the
            spec commit; leave it unticked if you bootstrapped with
            an empty commit.

            ### Step 4 — implement

            Run `/new-feature <feature path>` per
            `.claude/commands/new-feature.md`, applying the CI
            override above to every pause. Install the deps the
            file's "Tooling" section names; if you discover the
            feature genuinely needs deps the file didn't anticipate,
            add them and explain in the relevant code commit's body
            — the PR review is the gate.

            Follow the micro-commit discipline (AGENTS.md hard rule
            #10) — spec → tests → code by layer.

            **After every commit**, run this trio:

              1. `git push origin <branch>`
              2. `gh pr comment <pr-number> --body "<commit-subject> — <one-line scope>"`
              3. Tick the matching checklist line in the PR body and
                 append the commit to the Commits list. Read the
                 current body first with
                 `gh pr view <pr-number> --json body -q .body` so
                 you don't drop unrelated text, then write the new
                 body via `gh pr edit <pr-number> --body "<full new body>"`.

            If any of these three fails (network blip, rate limit),
            log it and continue. A missed comment is cosmetic — the
            commit list on the PR still shows the work. A missed push
            self-heals via Step 2's resume logic on the next
            scheduled run.

            ### Step 4a — Playwright e2e spec is mandatory for UI features

            If this feature adds or changes anything under `apps/web/`,
            you **MUST** author
            `apps/web/tests/e2e/<feature-slug>.spec.ts` per
            `/new-feature` step 7a, and land it as a
            `test(visual, web): user-flow spec for <feature>` commit
            **before** running Step 5 verify and **before** flipping
            the PR to ready in Step 6.

            The spec must cover **every** scenario named in the
            product-spec feature file's "User behavior" section:

              - One `test()` per numbered User-behavior step where the
                UI visibly changes, with a `toHaveScreenshot(...)` after
                the corresponding interaction.
              - One `test()` per named "Failure mode the user can reach"
                (network failure, upstream provider error, validation
                error, empty result, gating, etc.), forcing that state
                via `mockJsonError` or `page.route(..., r => r.abort())`.
              - One `test()` for the empty / first-run state.
              - For every authenticated-vs-unauthenticated divergence the
                feature file describes, an additional `test.describe`
                with `test.use({ authed: false })`.

            Non-negotiables (already in /new-feature step 7a — restated
            here so they are not silently dropped under CI pressure):

              - **Import from `./fixtures.js`**, never directly from
                `@playwright/test`. Auth is mocked universally there.
              - **Mocked responses must be typed via `mockJsonRoute` /
                `mockJsonError`** against the matching `@moc/contracts`
                Zod schema. No bare `page.route(..., r => r.fulfill({
                body: JSON.stringify({...}) }))` with an untyped object.
              - **Every `toHaveScreenshot(...)` is paired with
                `await expectAccessible(page)`** (AGENTS.md hard rule
                #13). A WCAG AA failure on token-driven UI means the
                token pair is wrong — fix `theme.css`, not the test.
              - **No raw `<button>` / `<input>` / `<textarea>` /
                `<select>`** in the feature's web code (AGENTS.md hard
                rule #14). DS components only.
              - **Selectors are accessible** (`getByRole`, `getByLabel`,
                `getByText`) and resolve to a real target — verify the
                label/text appears in the JSX of the `feat(web):`
                commit you just authored, in `@moc/design-system`, or
                already-on-branch code. CSS selectors and hallucinated
                labels are bugs at authoring time, not later.

            On the first run that adds the spec, generate baselines for
            **only the new spec**:

                npm --workspace apps/web run test:visual:update \
                  -- tests/e2e/<feature-slug>.spec.ts

            Commit the resulting PNGs in the same `test(visual, web):`
            commit so the PR shows the spec and its baselines together.
            Never run the workspace-wide `test:visual:web:update` —
            it overwrites every drifted baseline at once and silently
            masks unrelated regressions (AGENTS.md hard rule #12).

            **Hard gate:** a PR with a `feat(web):` commit but no
            `test(visual, web):` commit is treated as incomplete. Do
            not flip the draft PR to ready in Step 6 until the spec
            has landed and snaps green. If verify (Step 5) reveals the
            spec is missing, return here, author it, push, then
            re-run verify.

            ### Step 5 — verify at branch HEAD

            **Verify only at branch HEAD, not per commit.** The micro-
            commit discipline allows intermediate commits to be red
            (especially the test commit before implementation). Run
            `npm run verify` ONCE — after the final code commit on the
            branch. Per-commit verify is ~5x the wallclock cost for no
            real safety gain.

            After `npm run verify` is green, run `npm run verify:visual`
            for the Layer 1 (Lost Pixel / Ladle stories) and Layer 2
            (Playwright / pages) visual regression checks. Three
            outcomes to react to:

              a. **Both green.** Tick the verify + visual checklist
                 lines. Continue.

              b. **Failure + this is a UI change called for in the
                 feature file** (e.g. the file says "add a Tooltip
                 component" or "update Button hover color"). The
                 visual diff IS the intended change. Regenerate the
                 *specific* failing baselines — **never** the
                 workspace-wide `:update` scripts, which overwrite
                 every drifted baseline at once and silently mask
                 unrelated regressions:

                   - **Playwright (`apps/web/`):** target only the
                     spec(s) this feature touches. The npm script
                     passes args through to `playwright test
                     --update-snapshots`:

                         npm --workspace apps/web run test:visual:update \
                           -- tests/e2e/<feature-slug>.spec.ts

                     Append `-g "<title>"` for finer scope when only
                     one test in the spec is intentionally changing.

                   - **Lost Pixel (`libs/web/design-system/`):** the
                     CLI has no per-story filter, so surgical PNG copy:

                         # Compare; on failure, current/ and
                         # difference/ are still populated.
                         npm run test:visual:ds || true

                         # List what diffed.
                         ls libs/web/design-system/.lostpixel/difference/

                         # For each entry, classify:
                         #  (a) new story authored by this feature,
                         #  (b) existing story whose visual change is
                         #      intended by this feature,
                         #  (c) unrelated drift → STOP, fix the source.

                         # For (a) and (b) only, copy that one story's
                         # PNGs (one per breakpoint; the literal
                         # `[wNNNpx]` portion is matched by the *).
                         cp libs/web/design-system/.lostpixel/current/<story>--<variant>__*.png \
                            libs/web/design-system/.lostpixel/baseline/

                         # Re-run compare to confirm green.
                         npm run test:visual:ds

                 Then re-run the failing layer to confirm green. Commit
                 as `feat(visual): regenerate baselines for <feature>`
                 (push + comment + tick as usual). Per AGENTS.md hard
                 rule #12: regenerate baselines ONLY when the diff is
                 unambiguously the intended change. If you're unsure,
                 treat it as case (c).

              c. **Failure + the feature file didn't ask for a UI
                 change.** Code is wrong by default. Fix the source.
                 Don't regenerate.

              d. **First-run / no baselines exist yet for this feature.**
                 The new spec(s) / story(ies) this feature added need
                 baselines. Use the same targeted approach as (b) —
                 bulk `:update` is still wrong here because the
                 workspace likely already holds baselines for unrelated
                 specs/stories that would silently get rewritten if
                 they happened to be drifted. For each net-new spec,
                 run the targeted Playwright update by spec path; for
                 each net-new Ladle story, surgically copy its PNGs
                 from `.lostpixel/current/` to `.lostpixel/baseline/`.
                 Commit as `chore(visual): bootstrap baselines for
                 <feature>`, then proceed.

            ### Step 6 — promote the PR

            Per /new-feature step 11, mark the feature file
            `status: done` with `implemented-in-pr: <url>` in a final
            docs commit. If every feature in the epic is now done,
            also flip EPIC.md's status in the same commit. Push +
            comment + tick the "feature marked done" checklist line
            as usual.

            Then `gh pr ready <pr-number>` to flip the PR from draft
            to ready-for-review. If the call fails because the PR is
            already ready (resume case where a prior run promoted it
            before dying), ignore the error and continue.

            ## Hard constraints in CI (on top of AGENTS.md hard rules)
            - **Never weaken a test to make CI green.** If the suite
              goes red, fix the source — same rule as interactive mode.
            - **No `.github/workflows/` edits.** AGENTS.md hard rule #6.
            - **Never force-push.** Resume appends; it never rewrites
              history.
            - **`npm run verify` must be green** at branch HEAD before
              you flip the PR to ready. Once, at the end. Not after
              every commit.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Verbose Anthropic SDK logs when debug is on. Harmless when off.
          ANTHROPIC_LOG: ${{ github.event.inputs.debug == 'true' && 'debug' || '' }}
