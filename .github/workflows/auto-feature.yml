# Auto-implement next pending feature
#
# Triggers:
#   - workflow_dispatch — manual run from Actions tab or `gh workflow run`.
#     Inputs let you target a specific feature path and pick a model.
#   - schedule — every 5 hours (matches Claude Pro's rolling session
#     window so each run starts with a fresh quota).
#
# Concurrency is single-track: one auto-feature run at a time so two
# agents don't race on the same pending-epic file. If a scheduled run
# fires while a manual one is still going, the scheduled run queues.
#
# Output: a PR. The human gate is PR review — there is no human in the
# loop during the run itself.

name: Auto-implement next pending feature

on:
  workflow_dispatch:
    inputs:
      feature_path:
        description: "Optional: explicit product-specs/.../NN-<slug>.md path. Leave blank to auto-pick the lowest-numbered pending feature."
        required: false
        type: string
      model:
        description: "Model. Sonnet 4.6 is the default — cheaper on Pro quota, fast enough for most features. Switch to Opus 4.7 for tricky / large features."
        required: false
        default: "claude-sonnet-4-6"
        type: choice
        options:
          - "claude-sonnet-4-6"
          - "claude-opus-4-7"
      debug:
        description: "Verbose mode: stream Claude's tool I/O, model thinking, and per-step diagnostics. Off for cron runs."
        required: false
        default: false
        type: boolean
  schedule:
    # Every 5 hours, on the hour: 00:00, 05:00, 10:00, 15:00, 20:00 UTC.
    # Matches Claude Pro's session window so each run starts fresh.
    - cron: "0 */2 * * *"

concurrency:
  group: auto-feature
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Suppress npm interactive prompts
        # Some npm prompts (audit summary, funding banner) ignore CI=true
        # and slow / hang the install. Disable explicitly.
        run: |
          npm config set fund false
          npm config set audit false

      - run: npm ci

      - name: Install Playwright browsers
        # Layer 2 visual regression needs Chromium. --with-deps installs
        # the OS-level libs Playwright needs on the runner. Cached across
        # runs by setup-node's npm cache plus Playwright's own cache dir
        # is short-lived; this step takes ~30s on a cold cache, ~5s warm.
        # Run via the apps/web workspace because @playwright/test is pinned
        # to 1.47.x there (matches lost-pixel's playwright-core@1.47.2). With
        # that pin, npm doesn't hoist `playwright` to the root .bin dir, so
        # `npx playwright` from the repo root fails with `playwright: not
        # found`. `npm exec --workspace apps/web` resolves it correctly.
        run: npm exec --workspace apps/web -- playwright install chromium --with-deps

      - name: Bring up MongoDB (matches /prepare-local step 4)
        run: docker compose up -d mongo

      - name: Wait for Mongo healthy
        run: |
          until docker compose ps --format "{{.Name}} {{.Status}}" | grep -q "musy-mongo .*healthy"; do
            sleep 2
          done

      - name: Seed CI .env.local files
        # CI has no user-set values; write the same shape /prepare-local does.
        # SESSION_SECRET is generated per run because:
        #   - apps/api boots via getOrThrow("SESSION_SECRET") (auth module
        #     init), so leaving it blank crashes any test that boots the API.
        #   - sessions don't need to survive across CI runs, so a fresh
        #     value each run is fine and avoids needing a GitHub secret.
        # GOOGLE_* are dummies — auth.service.ts looks them up lazily,
        # so dummies satisfy boot. CI tests mock the OAuth flow; if any
        # test ever hits real Google with these dummies, it'll fail loudly
        # with an HTTP error from Google rather than a missing-env crash.
        run: |
          SESSION_SECRET="$(openssl rand -hex 48)"
          cat > apps/api/.env.local <<EOF
          NODE_ENV=development
          API_PORT=3001
          WEB_ORIGIN=http://localhost:5173
          MONGO_URI=mongodb://localhost:27117/musy
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=
          GOOGLE_CLIENT_ID=ci-dummy
          GOOGLE_CLIENT_SECRET=ci-dummy
          GOOGLE_REDIRECT_URI=http://localhost:5173/api/auth/google/callback
          SESSION_SECRET=${SESSION_SECRET}
          EOF
          cat > apps/web/.env.local <<EOF
          VITE_API_URL=/api
          VITE_API_TARGET=http://localhost:3001
          VITE_WEB_PORT=5173
          EOF

      - name: Configure git author for autonomous commits
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code-bot@users.noreply.github.com"

      - name: Run Claude Code
        # OAuth token (Pro / Max subscription billing) instead of an API key.
        # Generate locally with `claude setup-token`, store as the
        # `CLAUDE_CODE_OAUTH_TOKEN` repository secret.
        # Model: dispatched value if set, else sonnet-4-6 default (also
        # used for scheduled runs — workflow_dispatch inputs are empty
        # for cron triggers).
        # claude_args breakdown:
        #
        #   --dangerously-skip-permissions  (always, CI only)
        #     The project's .claude/settings.json has narrow Bash patterns
        #     tuned for interactive use (e.g. `Bash(npm install)` matches
        #     the bare command but not `npm install --workspace apps/web
        #     react-router-dom`). In CI there's no human to approve the
        #     prompt, so anything outside the exact-match allowlist hangs
        #     forever or aborts. This flag tells Claude Code to skip
        #     permission gating entirely. Safe in CI because:
        #       - the runner is ephemeral
        #       - GITHUB_TOKEN scopes are constrained by the workflow's
        #         `permissions:` block above
        #       - the PR review is the human gate on actual changes
        #     Never set this for local / interactive runs.
        #
        #   --verbose  (when debug is on)
        #     Full tool I/O + model reasoning instead of just the
        #     high-level summary.
        #
        # Companion knobs:
        #   show_full_output: true → un-hides the action's SDK-wrapped
        #     output (it's hidden by default for "security" — that's why
        #     `Running Claude Code via SDK (full output hidden for
        #     security)` shows up in non-debug runs)
        #   ANTHROPIC_LOG=debug (env block below) → SDK logs raw HTTP
        #
        # For full Actions runner debug (every step's command + env
        # expansion), also set repo-level variable ACTIONS_STEP_DEBUG=true
        # under Settings → Secrets and variables → Actions → Variables.
        # One-time, applies to every workflow on the repo.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ github.event.inputs.model || 'claude-sonnet-4-6' }}
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          claude_args: --dangerously-skip-permissions ${{ github.event.inputs.debug == 'true' && '--verbose' || '' }}
          show_full_output: ${{ github.event.inputs.debug == 'true' }}
          prompt: |
            You're running in CI under GitHub Actions. No human is at the
            other end during this run — the PR review is the human gate.

            ## CI override on slash-command pauses (read first, applies to everything below)
            Every "wait for sign-off", "stop and wait", "stop and ask",
            "get user approval", "loop until approved", or similar pause
            instruction inside any `.claude/commands/*.md` is **auto-
            approved** when running under this workflow. The pending-epic
            feature file is the user's pre-recorded answer to those
            questions: scope, tooling, design-system check, invariants,
            acceptance criteria. Proceed without pausing. If you find
            yourself about to wait for input, stop and proceed instead.

            ## Your job
            Implement one pending feature from `product-specs/` and open a PR.

            ## Algorithm
            1. If the input `${{ github.event.inputs.feature_path }}` is non-empty,
               that's the feature file. Use it directly.
            2. Otherwise, find the lowest-numbered file under
               `product-specs/*/features/NN-*.md` whose YAML frontmatter has
               `status: pending`. Sort by epic name first, then numeric prefix.
               If nothing is pending, print a summary and exit cleanly — do
               not commit.
            3. Run `/new-feature <that path>` per `.claude/commands/new-feature.md`.
               Apply the CI override above to every pause. Install the deps
               the file's "Tooling" section names; if you discover the feature
               genuinely needs deps the file didn't anticipate, add them and
               explain in the relevant code commit's body — the PR review is
               the gate.
            4. Follow the micro-commit discipline (AGENTS.md hard rule #10) —
               spec → tests → code by layer.
            5. **Branch naming.** Use the slash command's recommended branch
               name (e.g. `task-<slug>`). If `git ls-remote --heads origin
               <branch>` returns the branch (a stale leftover from a prior
               run), suffix yours with `-r${{ github.run_id }}` to make it
               unique. Never force-push to an existing branch.
            6. **Verify only at branch HEAD, not per commit.** The micro-
               commit discipline allows intermediate commits to be red
               (especially the test commit before implementation). Run
               `npm run verify` ONCE — after the final code commit on the
               branch, before `git push`. Per-commit verify is ~5x the
               wallclock cost for no real safety gain (the discipline only
               requires HEAD green).

               After `npm run verify` is green, run `npm run verify:visual`
               for the Layer 1 (Lost Pixel / Ladle stories) and Layer 2
               (Playwright / pages) visual regression checks. Three
               outcomes to react to:

                 a. **Both green.** Push and continue.

                 b. **Failure + this is a UI change called for in the
                    feature file** (e.g. the file says "add a Tooltip
                    component" or "update Button hover color"). The
                    visual diff IS the intended change. Regenerate the
                    *specific* failing baselines:
                      - Lost Pixel: `npm run test:visual:ds:update`
                      - Playwright: `npm run test:visual:web:update`
                    Then re-run the comparison to confirm green. Commit
                    the new baselines as `feat(visual): regenerate
                    baselines for <feature>` (PNGs land alongside code).
                    Per AGENTS.md hard rule #12: regenerate baselines
                    ONLY when the diff is unambiguously the intended
                    change. If you're unsure, treat it as case (c).

                 c. **Failure + the feature file didn't ask for a UI
                    change** (e.g. a backend feature broke a layout, or
                    a stray className change drifted off-token). Code is
                    wrong by default. Fix the source. Don't regenerate.

                 d. **First-run / no baselines exist yet.** A fresh epic
                    that hasn't been bootstrapped. Run the `:update`
                    scripts once, commit baselines as
                    `chore(visual): bootstrap baselines for <feature>`,
                    then proceed. Subsequent runs compare against them.
            7. Open the PR via `gh pr create` using GITHUB_TOKEN.
               **Always pass `--title` and `--body` non-interactively** —
               never let the command open an editor (it'll hang forever in
               CI). Title `task: <short title>`; body lists the commit
               sequence, the new invariant IDs, the source pending-epic
               feature file path, and confirms `npm run verify` is green
               at the branch HEAD.
            8. Per /new-feature step 11, mark the feature file
               `status: done` with `implemented-in-pr: <url>` in a final docs
               commit. If every feature in the epic is now done, also flip
               EPIC.md's status in the same commit.

            ## Hard constraints in CI (on top of AGENTS.md hard rules)
            - **Never weaken a test to make CI green.** If the suite goes
              red, fix the source — same rule as interactive mode.
            - **No `.github/workflows/` edits.** AGENTS.md hard rule #6.
            - **`npm run verify` must be green** at the branch HEAD before
              you push and open the PR. Once. Not after every commit.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Verbose Anthropic SDK logs when debug is on. Harmless when off.
          ANTHROPIC_LOG: ${{ github.event.inputs.debug == 'true' && 'debug' || '' }}
