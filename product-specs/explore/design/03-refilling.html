<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=375, initial-scale=1" />
    <title>Explore — refilling</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        font-size: var(--text-md);
        line-height: var(--leading-normal);
        width: 375px;
        min-height: 100vh;
      }
      .screen {
        display: flex;
        flex-direction: column;
        width: 375px;
        height: 667px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 48px;
        padding: 0 var(--spacing-4);
        flex-shrink: 0;
      }
      .topbar h1 {
        margin: 0;
        font-size: var(--text-lg);
        font-weight: var(--font-weight-semibold);
      }
      .phase-pill {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-2);
        padding: var(--spacing-1) var(--spacing-3);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        font-size: var(--text-xs);
        color: var(--color-text-muted);
      }
      .phase-pill .dot {
        width: 6px;
        height: 6px;
        background: var(--color-accent);
        border-radius: var(--radius-full);
      }

      /* Empty/loading state replacing the card stack */
      .empty-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--spacing-6);
        gap: var(--spacing-6);
      }
      .dots {
        display: flex;
        gap: var(--spacing-2);
        align-items: center;
      }
      .dot-anim {
        width: 10px;
        height: 10px;
        border-radius: var(--radius-full);
        background: var(--color-text-muted);
      }
      .dot-anim:nth-child(1) {
        opacity: 0.3;
      }
      .dot-anim:nth-child(2) {
        opacity: 0.6;
      }
      .dot-anim:nth-child(3) {
        opacity: 1;
      }
      .empty-text {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: var(--spacing-2);
      }
      .empty-title {
        font-size: var(--text-md);
        color: var(--color-text);
        margin: 0;
      }
      .empty-caption {
        font-size: var(--text-sm);
        color: var(--color-text-muted);
        margin: 0;
      }
      .retry-btn {
        margin-top: var(--spacing-4);
        padding: var(--spacing-3) var(--spacing-6);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        color: var(--color-text);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-medium);
      }

      /* Action row, all disabled */
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-around;
        height: 80px;
        padding: 0 var(--spacing-6);
        flex-shrink: 0;
        opacity: 0.4;
      }
      .action-btn {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-full);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-xl);
        color: var(--color-text-muted);
      }

      .bottom-nav {
        display: flex;
        height: 56px;
        background: var(--color-surface);
        border-top: 1px solid var(--color-border);
        flex-shrink: 0;
      }
      .nav-tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-1);
        font-size: var(--text-xs);
        color: var(--color-text-muted);
      }
      .nav-tab.active {
        color: var(--color-primary);
      }
      .nav-icon {
        font-size: var(--text-lg);
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <header class="topbar">
        <h1>Explore</h1>
        <span class="phase-pill"><span class="dot"></span>Discovering taste</span>
      </header>

      <main class="empty-area">
        <div class="dots" aria-label="Loading">
          <span class="dot-anim"></span>
          <span class="dot-anim"></span>
          <span class="dot-anim"></span>
        </div>
        <div class="empty-text">
          <p class="empty-title">Finding more for you</p>
          <p class="empty-caption">Inspired by your taste</p>
        </div>
        <button class="retry-btn">Try again</button>
      </main>

      <div class="actions" aria-disabled="true">
        <button class="action-btn" aria-label="Pass" disabled>✕</button>
        <button class="action-btn" aria-label="Pause" disabled>⏸</button>
        <button class="action-btn" aria-label="Like" disabled>♥</button>
      </div>

      <nav class="bottom-nav">
        <div class="nav-tab active">
          <span class="nav-icon">⊙</span>
          <span>Explore</span>
        </div>
        <div class="nav-tab">
          <span class="nav-icon">♡</span>
          <span>Taste</span>
        </div>
        <div class="nav-tab">
          <span class="nav-icon">⌕</span>
          <span>Search</span>
        </div>
      </nav>
    </div>
  </body>
</html>
