<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1" />
  <title>Taste — building</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    .app { display: flex; flex-direction: column; height: 667px; }

    .header {
      flex: 0 0 auto;
      padding: var(--spacing-4) var(--spacing-4);
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--spacing-3);
    }
    .header h1 {
      font-size: var(--text-2xl);
      font-weight: var(--font-weight-bold);
      line-height: var(--leading-tight);
    }

    .btn-mix {
      padding: var(--spacing-2) var(--spacing-3);
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--color-text);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      border: none;
      display: flex; align-items: center; gap: var(--spacing-2);
      min-height: 36px;
      cursor: pointer;
    }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 0 var(--spacing-4) var(--spacing-4);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-4);
    }

    .bucket-card { display: flex; flex-direction: column; gap: var(--spacing-2); }
    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }
    .cover-1 { background: linear-gradient(135deg, oklch(0.55 0.18 320), oklch(0.35 0.12 340)); }
    .cover-2 { background: linear-gradient(135deg, oklch(0.45 0.10 60), oklch(0.30 0.08 30)); }
    .cover-3 { background: linear-gradient(135deg, oklch(0.40 0.12 200), oklch(0.25 0.08 230)); }

    .cover-building {
      position: relative;
      background: var(--color-surface);
      overflow: hidden;
    }
    .cover-building::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        oklch(0.30 0.01 270) 50%,
        transparent 100%
      );
      animation: shimmer 1.6s linear infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .bucket-name {
      font-size: var(--text-md);
      font-weight: var(--font-weight-semibold);
      line-height: var(--leading-tight);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .bucket-name.building {
      color: var(--color-text-muted);
      font-style: italic;
      font-weight: var(--font-weight-regular);
    }
    .building-prompt {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-top: -4px;
      font-style: italic;
    }

    /* Bottom nav */
    .bottom-nav {
      flex: 0 0 auto;
      height: 64px;
      border-top: 1px solid var(--color-border);
      background: var(--color-bg);
      display: flex; align-items: center; justify-content: space-around;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px;
      color: var(--color-text-muted);
      font-size: var(--text-xs);
      padding: var(--spacing-2);
    }
    .nav-item.active { color: var(--color-text); }
    .nav-item .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Taste</h1>
      <button class="btn-mix">✨ New mix</button>
    </header>

    <main class="content">
      <div class="grid">
        <div class="bucket-card">
          <div class="cover cover-building"></div>
          <div class="bucket-name building">Building…</div>
          <div class="building-prompt">"rainy day jazz"</div>
        </div>
        <div class="bucket-card">
          <div class="cover cover-1"></div>
          <div class="bucket-name">Late night drives</div>
        </div>
        <div class="bucket-card">
          <div class="cover cover-2"></div>
          <div class="bucket-name">Hyperpop &amp; dance</div>
        </div>
        <div class="bucket-card">
          <div class="cover cover-3"></div>
          <div class="bucket-name">Cozy lo-fi</div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <div class="nav-item"><span class="nav-icon">🔥</span>Explore</div>
      <div class="nav-item"><span class="nav-icon">🔍</span>Search</div>
      <div class="nav-item active"><span class="nav-icon">✨</span>Taste</div>
    </nav>
  </div>
</body>
</html>
