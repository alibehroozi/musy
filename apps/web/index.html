<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicons (generated by @vite-pwa/assets-generator) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-source.svg" sizes="any" type="image/svg+xml" />

    <!--
      iOS Safari does NOT read the web manifest. These four lines are
      the iOS-equivalent of `display: standalone` + the home-screen
      icon — without them, "Add to Home Screen" produces a generic
      screenshot icon and the app launches inside Safari chrome rather
      than as a standalone PWA.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="musy" />

    <title>musy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
