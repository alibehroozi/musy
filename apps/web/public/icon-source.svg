<?xml version="1.0" encoding="UTF-8"?>
<!--
  musy — brand placeholder icon source.
  Black background with a purple-gradient "musy" wordmark and a play-triangle
  accent. Designed for 1024x1024; @vite-pwa/assets-generator (minimal-2023
  preset) rasterizes it into the favicon + 192/512 + 180 apple-touch +
  512 maskable PNGs that the manifest and apple-touch links reference.

  Maskable safe-zone is 80% (819x819 centered). All foreground geometry
  stays inside that zone so Android adaptive icons don't crop the wordmark.
-->
<svg
  viewBox="0 0 1024 1024"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="musy logo"
>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a05cd6" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="triangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Pure black background -->
  <rect width="1024" height="1024" fill="#000000" />
  <!-- Soft centered glow -->
  <rect width="1024" height="1024" fill="url(#glow)" />

  <!-- Brand mark: play triangle above the wordmark -->
  <g transform="translate(512 512)">
    <path
      d="M -78 -218 L 82 -138 L -78 -58 Z"
      fill="url(#triangle)"
    />
    <!-- Wordmark "musy" — chunky bold sans -->
    <text
      x="0"
      y="118"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif"
      font-weight="900"
      font-size="300"
      letter-spacing="-14"
      fill="url(#wordmark)"
    >musy</text>
    <!-- Thin underline accent -->
    <rect
      x="-150"
      y="160"
      width="300"
      height="10"
      rx="5"
      fill="#7c3aed"
      opacity="0.55"
    />
  </g>
</svg>
