<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1" />
  <title>Taste — request mix modal</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    .app { display: flex; flex-direction: column; height: 667px; position: relative; }

    /* Dimmed taste page behind */
    .header {
      padding: var(--spacing-4);
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 {
      font-size: var(--text-2xl);
      font-weight: var(--font-weight-bold);
    }
    .btn-mix {
      padding: var(--spacing-2) var(--spacing-3);
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--color-text);
      font-size: var(--text-sm);
      border: none;
      min-height: 36px;
    }
    .content { flex: 1 1 auto; overflow: hidden; padding: 0 var(--spacing-4); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-4); }
    .bucket-card { display: flex; flex-direction: column; gap: var(--spacing-2); }
    .cover {
      width: 100%; aspect-ratio: 1/1;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }
    .cover-1 { background: linear-gradient(135deg, oklch(0.32 0.12 270), oklch(0.18 0.08 320)); }
    .cover-2 { background: linear-gradient(135deg, oklch(0.55 0.18 320), oklch(0.35 0.12 340)); }
    .cover-3 { background: linear-gradient(135deg, oklch(0.45 0.10 60), oklch(0.30 0.08 30)); }
    .cover-4 { background: linear-gradient(135deg, oklch(0.40 0.12 200), oklch(0.25 0.08 230)); }
    .bucket-name {
      font-size: var(--text-md);
      font-weight: var(--font-weight-semibold);
    }

    .bottom-nav {
      height: 64px;
      border-top: 1px solid var(--color-border);
      background: var(--color-bg);
      display: flex; align-items: center; justify-content: space-around;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px;
      color: var(--color-text-muted);
      font-size: var(--text-xs);
    }
    .nav-item.active { color: var(--color-text); }

    /* Modal scrim + dialog */
    .scrim {
      position: absolute; inset: 0;
      background: rgb(0 0 0 / 0.6);
      display: flex; align-items: center; justify-content: center;
      padding: var(--spacing-4);
      z-index: 200;
    }
    .modal {
      width: 100%;
      max-width: 340px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: var(--spacing-6);
      display: flex; flex-direction: column; gap: var(--spacing-4);
    }
    .modal-title {
      font-size: var(--text-xl);
      font-weight: var(--font-weight-semibold);
    }
    .modal-desc {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .input {
      width: 100%;
      padding: var(--spacing-3);
      border-radius: var(--radius-md);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      font-size: var(--text-md);
      font-family: inherit;
      min-height: 44px;
    }
    .input::placeholder { color: var(--color-text-muted); }
    .modal-actions {
      display: flex; gap: var(--spacing-3); justify-content: flex-end;
      margin-top: var(--spacing-2);
    }
    .btn {
      padding: var(--spacing-3) var(--spacing-4);
      border-radius: var(--radius-md);
      font-size: var(--text-md);
      font-weight: var(--font-weight-medium);
      border: none; cursor: pointer;
      min-height: 44px;
    }
    .btn-ghost { background: transparent; color: var(--color-text-muted); }
    .btn-primary { background: var(--color-primary); color: var(--color-text); }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Taste</h1>
      <button class="btn-mix">✨ New mix</button>
    </header>
    <main class="content">
      <div class="grid">
        <div class="bucket-card"><div class="cover cover-1"></div><div class="bucket-name">Late night drives</div></div>
        <div class="bucket-card"><div class="cover cover-2"></div><div class="bucket-name">Hyperpop &amp; dance</div></div>
        <div class="bucket-card"><div class="cover cover-3"></div><div class="bucket-name">Cozy lo-fi</div></div>
        <div class="bucket-card"><div class="cover cover-4"></div><div class="bucket-name">90s indie</div></div>
      </div>
    </main>
    <nav class="bottom-nav">
      <div class="nav-item">🔥<br />Explore</div>
      <div class="nav-item">🔍<br />Search</div>
      <div class="nav-item active">✨<br />Taste</div>
    </nav>

    <!-- Modal overlay -->
    <div class="scrim">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Request a taste mix">
        <div class="modal-title">Request a taste mix</div>
        <div class="modal-desc">Describe the mood — we'll find the songs from your taste.</div>
        <input class="input" type="text" placeholder="e.g. dreamy late-night focus" />
        <div class="modal-actions">
          <button class="btn btn-ghost">Cancel</button>
          <button class="btn btn-primary">Generate</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
